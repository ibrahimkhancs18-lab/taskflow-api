name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ibrahim806/taskflow-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore src/TaskFlow.Api/TaskFlow.Api.csproj

      - name: Build
        run: dotnet build src/TaskFlow.Api/TaskFlow.Api.csproj -c Release --no-restore

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t taskflow-api:${{ github.sha }} .

      - name: Smoke test (start the container, call /health)
        run: |
          docker run -d --name api -p 8080:8080 taskflow-api:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs localhost:8080/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  publish:
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ibrahim806
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}